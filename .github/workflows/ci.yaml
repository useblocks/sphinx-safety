name: CI
on:
  pull_request:
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        # uv installs the version pinned in .python-version; setup-python has no
        # prebuilt 3.12.7 for the ubuntu-latest (26.04) runner image.
        run: uv python install
      - name: Install graphviz and Java
        run: sudo apt-get update && sudo apt-get --yes install graphviz openjdk-21-jre
      - name: Build docs
        run: uv run sphinx-build -b html . _build/html
  all_good:
    name: all_good
    # Aggregation gate — the single required check on main: every CI job is
    # listed in `needs:`, and this job fails unless all of them succeeded, so
    # adding a job here makes it required without touching the ruleset.
    needs: [docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every needed job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "::error::Required job result was '${r}', not success"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
