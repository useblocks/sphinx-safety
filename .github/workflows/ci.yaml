name: CI
on:
  pull_request:
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install graphviz and Java
        run: sudo apt-get --yes install graphviz openjdk-21-jre
      - name: Build docs
        run: uv run sphinx-build -b html . _build/html